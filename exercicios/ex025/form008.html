<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <h1>Exemplo de Formulario</h1>
    <form action="cadastro.php" method="get" autocomplete="on">
        <p>
            <label for="in1">Numero 1: </label>
            <input type="number" name="n1" id="in1" min="0" max="50" required oninput="document.getElementById('id-soma').innerHTML = Number(this.value) + Number(document.getElementById('id-n2').value)">
        </p>

        <p>
            <label for="in2">Numero 2: </label>
            <input type="number" name="n2" id="in2" min="0" max="50" required oninput="document.getElementById('id-soma').innerHTML = Number(this.value) + Number(document.getElementById('id-n2').value)">
        </p>
        <p>
            <label for="id-soma">Soma:</label>
            <output for="id-n1 id-n2" id="id-soma">0</output>
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
